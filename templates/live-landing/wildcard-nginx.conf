# ==============================================================================
# CONFIGURACIÓN WILDCARD NGINX PARA LIVE LANDINGS MULTI-SUBDOMINIO
# Servidor: VPS Contabo 161.97.160.76
# Dominio: *.wentixai.digital (o *.tudominio.com)
# ==============================================================================

# 1. Redirección HTTP a HTTPS para todos los subdominios
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.wentixai\.digital$ wentixai.digital;

    location /.well-known/acme-challenge/ {
        root /var/lib/nexora/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS con Wildcard SSL
server {
    listen 443 ssl http2;
    server_name ~^(?<subdomain>.+)\.wentixai\.digital$ wentixai.digital;

    # Certificado SSL Wildcard (Generado con: certbot certonly --manual -d "*.wentixai.digital" -d "wentixai.digital")
    ssl_certificate /etc/letsencrypt/live/wentixai.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wentixai.digital/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Directorio de los archivos estáticos de la Live Landing (1 solo build)
    root /opt/nexora/landings/dist;
    index index.html;

    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy para la API de órdenes y stock de Nexora ERP
    location /api/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir archivos estáticos del build con caché
    location /_next/static/ {
        alias /opt/nexora/landings/dist/_next/static/;
        expires 30d;
        access_log off;
    }

    # SPA Fallback: Todo subdominio sirve el index.html
    # El hook 'useSubdomainConfig.ts' en el navegador se encarga de leer el subdominio ($subdomain)
    # y cargar la ficha técnica del producto correspondiente en 0.1 segundos.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
